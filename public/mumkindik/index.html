<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мүмкіндік: вузы, гранты и конкурсы Казахстана</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Мүмкіндік: вузы, гранты и ЕНТ в Казахстане">
<meta property="og:description" content="Требования вузов, гранты по специальностям и подбор по баллу ЕНТ.">
<meta property="og:url" content="https://makys0.github.io/Not-bad-site/mumkindik/">
<meta property="og:image" content="https://makys0.github.io/Not-bad-site/mumkindik/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="description" content="Вузы Казахстана с требованиями IELTS, SAT и ЕНТ, гранты по специальностям, подбор по баллу ЕНТ, IT-конкурсы и акселераторы. Қазақша және орысша.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap">
<style>
/* Structure borrowed from ucas.com: white page, one accent colour, a slim bar of visible tabs,
   a short home screen with shortcuts. Colours, type and artwork are our own. */
:root{
  --ink:#16202c; --muted:#5b6675; --line:#e1e5ea; --soft:#f4f6f8;
  --accent:#1d5fd0; --accent-soft:#e8f0fd;
  --ok:#12784a; --ok-soft:#e2f4ea; --warn:#a8480c; --warn-soft:#fdeee3;
  --r:12px;
}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:16px/1.5 "Rubik","Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
h1,h2,h3{margin:0;line-height:1.15;font-weight:700;overflow-wrap:break-word}
[hidden]{display:none!important}

/* top bar with tabs */
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:24px;min-height:64px}
.brand{font-size:22px;font-weight:700;color:var(--ink);text-decoration:none;white-space:nowrap}
nav{display:flex;gap:4px;flex:1;overflow-x:auto;align-self:stretch}
nav a{display:flex;align-items:center;padding:0 14px;color:var(--muted);text-decoration:none;font-weight:500;white-space:nowrap;border-bottom:3px solid transparent;border-top:3px solid transparent}
nav a:hover{color:var(--ink)}
nav a[aria-current]{color:var(--accent);border-bottom-color:var(--accent)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.lang button{font:500 14px inherit;font-family:inherit;color:var(--muted);background:none;border:0;padding:0 14px;min-height:40px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:#fff}

main.wrap{padding-top:40px;padding-bottom:64px;min-height:70vh}
h2{font-size:clamp(28px,3.4vw,40px)}
.sub{margin:8px 0 28px;color:var(--muted);font-size:17px;max-width:44em}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r)}

/* shared controls */
label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500;color:var(--muted)}
select,input[type=search],input[type=number]{font:inherit;color:var(--ink);background:#fff;border:1px solid #b9c1cb;border-radius:8px;padding:9px 12px;min-height:44px;width:100%}
.check{flex-direction:row;align-items:center;gap:8px;font-size:16px;font-weight:400;color:var(--ink);min-height:44px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.btn{font:500 16px inherit;font-family:inherit;color:#fff;background:var(--accent);border:0;border-radius:999px;padding:0 22px;min-height:48px;cursor:pointer}
.ghost{font:500 15px inherit;font-family:inherit;color:var(--ink);background:#fff;border:1px solid #b9c1cb;border-radius:999px;padding:0 18px;min-height:44px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0}
.chip{font-size:13px;font-weight:500;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--muted)}
.chip.money{background:var(--accent-soft);color:var(--accent)}

/* home */
.home{text-align:center}
.home h1{font-size:clamp(34px,5vw,60px);max-width:16em;margin:16px auto 0}
.home .lead{margin:14px auto 0;font-size:19px;color:var(--muted)}
#quick{display:flex;gap:8px;align-items:center;justify-content:center;margin:28px auto 0;padding:8px;max-width:560px;border:1px solid var(--line);border-radius:999px;box-shadow:0 6px 24px rgba(22,32,44,.08)}
#quick label{flex:1;flex-direction:row;align-items:center;gap:10px;padding-left:16px;white-space:nowrap}
#quick input{border:0;min-height:44px;padding:0 4px}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin:48px 0 0;text-align:left}
.tile{display:block;padding:20px;color:var(--ink);text-decoration:none}
.tile:hover{border-color:var(--accent)}
.tile svg{width:36px;height:36px;color:var(--accent)}
.tile b{display:block;margin-top:12px;font-size:19px}
.tile span{display:block;margin-top:4px;color:var(--muted);font-size:15px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:16px 0 0;padding:0;list-style:none;text-align:left}
.stats li{padding:16px 20px;background:var(--soft);border-radius:var(--r)}
.stats b{display:block;font-size:30px;line-height:1.1}
.stats span{color:var(--muted);font-size:15px}
.scene{display:block;width:100%;height:auto;margin-top:40px}

/* programmes */
#filters{display:grid;grid-template-columns:2fr 1fr 1fr auto auto;gap:16px;align-items:end;padding:16px;background:var(--soft);border-radius:var(--r)}
#found{margin:20px 0 12px;color:var(--muted)}
#list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.prog{padding:20px;display:flex;flex-direction:column;gap:6px}
.prog h3{font-size:21px;margin-top:6px}
.prog p{margin:0}
.prog .org{color:var(--muted);font-size:15px}
.prog .foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:auto;padding-top:12px}
.state{font-size:14px;font-weight:500;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--muted)}
.state.open{background:var(--ok-soft);color:var(--ok)}
.links{display:flex;gap:16px;font-weight:500}
.empty{grid-column:1/-1;padding:32px 0;color:var(--muted)}

/* universities */
#cities{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
#cities button{font:500 15px inherit;font-family:inherit;color:var(--ink);background:#fff;border:1px solid #b9c1cb;border-radius:999px;padding:0 16px;min-height:40px;cursor:pointer}
#cities button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
#uniGrid,.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;align-items:start}
.uni{overflow:hidden;scroll-margin-top:84px}
#compare{scroll-margin-top:84px}
.uni:target{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.uni figure{position:relative;margin:0;aspect-ratio:16/9;background:var(--soft)}
.uni figure img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.uni figcaption{position:absolute;right:0;bottom:0;padding:1px 8px;font-size:11px;background:rgba(22,32,44,.7)}
.uni figcaption a{color:#fff}
.pad{padding:16px 20px 18px}
.uni header{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.uni h3{font-size:20px}
.uni header p{margin:0;color:var(--muted);font-size:15px;white-space:nowrap}
/* requirements as rows: label, value, caption. Three narrow boxes broke long words mid-syllable. */
dl{margin:14px 0 0;border-top:1px solid var(--line)}
.req{display:grid;grid-template-columns:52px 80px minmax(0,1fr);gap:8px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.req dt{font-size:13px;font-weight:500;color:var(--muted)}
.req dd{display:contents}
.req b{font-size:20px;line-height:1.2}
.req span{font-size:13.5px;line-height:1.35;color:var(--muted)}
.req.none b{color:#a3acb8}
details{margin-top:6px;border-bottom:1px solid var(--line)}
details[open]{padding-bottom:10px}
summary{cursor:pointer;font-weight:500;padding:10px 0 2px;color:var(--accent)}
details p{margin:8px 0 0;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:14.5px}
caption{text-align:left;color:var(--muted);font-size:13px;padding:8px 0 4px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:13px;border-bottom:1px solid var(--line);padding:6px 8px 6px 0;vertical-align:bottom}
td{padding:7px 8px 7px 0;border-bottom:1px solid var(--line);vertical-align:top}
th.n,td.n{text-align:right;padding-right:0;padding-left:10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.fee{margin:10px 0 0;font-size:15px}
.cmp{margin-top:10px;font-size:15px}
#compare{padding:16px 20px;margin-bottom:20px;overflow-x:auto}
.cmphead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.cmphead h3{font-size:20px}
#cmpBar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:14px;padding:8px 8px 8px 20px;max-width:calc(100vw - 24px);background:var(--ink);color:#fff;border-radius:999px;box-shadow:0 8px 28px rgba(22,32,44,.25);font-size:15px}
#cmpBar .btn{min-height:40px;white-space:nowrap}
#compare table{font-size:15px}
#compare thead th{font-size:16px;color:var(--ink)}
#compare tbody th{white-space:nowrap;width:1%;padding-right:20px}
.pair{display:block;font-size:13px;color:var(--muted)}
.src{margin:12px 0 0;font-size:13px}
.src a{color:var(--muted)}

/* finder */
#finderForm{display:grid;align-items:end;grid-template-columns:200px minmax(0,280px) minmax(0,340px) auto;gap:16px;padding:16px;background:var(--soft);border-radius:var(--r);margin-bottom:20px}
.results{padding:4px 20px 16px}
.results table{font-size:16px}
.results th,.results td{padding:11px 12px 11px 0}
.you{display:inline-block;font-size:14px;font-weight:500;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pass .you{background:var(--ok-soft);color:var(--ok)}
.fail .you{background:var(--warn-soft);color:var(--warn)}
.under{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:16px}
#copyNote{color:var(--ok);font-size:15px}
.star{font-size:26px;line-height:1;font-family:inherit;color:var(--muted);background:none;border:0;min-width:44px;min-height:44px;cursor:pointer}
.star[aria-pressed=true]{color:#d99a00}
td.none{padding:24px 0;color:var(--muted)}
/* calendar */
#calendar{list-style:none;margin:0;padding:4px 20px}
.ev{display:grid;grid-template-columns:230px minmax(0,1fr) auto;gap:20px;align-items:start;padding:16px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .when b{display:block;font-size:17px}
.ev .when span{font-size:14px;color:var(--muted)}
.ev.now .when span{color:var(--ok);font-weight:500}
.ev h3{font-size:18px}
.ev p{margin:4px 0 0;color:var(--muted);font-size:15px}
.ev .chips{margin-top:8px}
.ev.past{opacity:.55}
h2.second{margin-top:48px}
/* abroad */
.abroad{padding:18px 20px}
.abroad h3{font-size:22px;margin-top:10px}
.rows{margin:12px 0 0}
.rows div{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.rows dt{color:var(--muted);font-size:14px;padding-top:1px}
.rows dd{margin:0;font-size:15px}
p.factsrc{margin:-8px 0 28px}
.under2{margin-top:28px}
.bolashak{margin:10px 0 0}

/* grants */
.tilesrow{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:0 0 20px;padding:0;list-style:none}
.tilesrow li{padding:16px 20px;background:var(--soft);border-radius:var(--r)}
.tilesrow b{display:block;font-size:30px;line-height:1.1}
.tilesrow span{color:var(--muted);font-size:15px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.box{padding:20px}
.box h3{font-size:20px;margin-bottom:16px}
.plain{list-style:none;margin:0;padding:0}
#directions li{display:grid;grid-template-columns:1fr 72px;gap:2px 12px;align-items:center;margin-bottom:12px}
#directions .lbl{grid-column:1/-1;font-size:15px}
#directions .bar{height:12px;width:var(--w);background:var(--accent);border-radius:999px}
#directions b{text-align:right;font-variant-numeric:tabular-nums}
#thresholds li{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line)}
#thresholds li:first-child{border-top:0;padding-top:0}
#thresholds b{font-size:24px}
.small{color:var(--muted);font-size:14px;margin:12px 0 0}
.facts{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.facts li{padding:12px 14px;background:var(--soft);border-radius:8px}
.facts b{display:block;font-size:24px;line-height:1.2}
.facts span{font-size:14px;color:var(--muted)}
.span2{grid-column:1/-1}

footer{padding:24px 0 40px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
footer p{margin:0 0 8px}
footer a{color:var(--muted);margin-right:14px;white-space:nowrap}

@media (max-width:1000px){
  .tiles,.stats,.tilesrow{grid-template-columns:repeat(2,1fr)}
  #uniGrid,.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
  #filters{grid-template-columns:1fr 1fr}
  .facts{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:700px){
  .top .wrap{flex-wrap:wrap;gap:0 12px;padding-top:8px}
  nav{order:3;flex-basis:100%;min-height:44px}
  .brand{flex:1}
  main.wrap{padding-top:24px}
  #quick{flex-direction:column;align-items:stretch;border-radius:var(--r)}
  .tiles,#list,#uniGrid,.grid3,.cols,#filters,#finderForm{grid-template-columns:minmax(0,1fr)}
  .stats b,.tilesrow b{font-size:24px}
  .facts{grid-template-columns:repeat(2,1fr)}
  /* finder rows become stacked blocks: a five-column table does not fit a phone */
  #compare tbody th{white-space:normal;padding-right:8px}
  #compare td,#compare thead th:not(:first-child){min-width:130px}
  .results thead{display:none}
  .results tr{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .results td,.results td.n{border:0;padding:0;text-align:left}
  .results td:nth-child(1),.results td:nth-child(2){grid-column:1/-1}
  .results td:nth-child(1){font-weight:500}
  .results td[data-l]::before{content:attr(data-l) ": ";color:var(--muted)}
  .results td:nth-child(5){margin-top:4px}
  .results tr{position:relative;padding-right:44px}
  .results td:nth-child(6){position:absolute;top:2px;right:-6px}
  .ev{grid-template-columns:minmax(0,1fr);gap:6px}
}
</style>
</head>
<body>
<div class="top">
  <div class="wrap">
    <a class="brand" href="#home">Мүмкіндік</a>
    <nav aria-label="Разделы">
      <a href="#home" data-t="tabHome"></a>
      <a href="#unis" data-t="tabUnis"></a>
      <a href="#finder" data-t="tabFinder"></a>
      <a href="#grants" data-t="tabGrants"></a>
      <a href="#abroad" data-t="tabAbroad"></a>
      <a href="#calendar" data-t="tabPrograms"></a>
    </nav>
    <div class="lang" role="group" aria-label="Тіл / Язык">
      <button type="button" data-lang="kz">Қаз</button>
      <button type="button" data-lang="ru">Рус</button>
    </div>
  </div>
</div>

<main class="wrap">
  <!-- Home: only the introduction and shortcuts to the tabs -->
  <section class="home" data-panel="home">
    <h1 data-t="h1"></h1>
    <p class="lead" data-t="lead"></p>
    <form id="quick">
      <label><span data-t="scoreLabel"></span><input type="number" name="score" min="0" max="140" inputmode="numeric" placeholder="0–140" required></label>
      <button class="btn" data-t="scoreGo"></button>
    </form>
    <div class="tiles">
      <a class="card tile" href="#unis">
        <svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M4 14 18 6l14 8H4zM7 14v13M14 14v13M22 14v13M29 14v13M4 30h28"/></svg>
        <b data-t="tabUnis"></b><span data-t="tileUnisD"></span>
      </a>
      <a class="card tile" href="#finder">
        <svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="16" cy="16" r="10"/><path d="m24 24 7 7M12 16l3 3 5-6"/></svg>
        <b data-t="tabFinder"></b><span data-t="tileFinderD"></span>
      </a>
      <a class="card tile" href="#grants">
        <svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 30V18M14 30V8M22 30V14M30 30V22M3 30h30"/></svg>
        <b data-t="tabGrants"></b><span data-t="tileGrantsD"></span>
      </a>
      <a class="card tile" href="#abroad">
        <svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="18" r="13"/><path d="M5 18h26M18 5c4 4 6 8 6 13s-2 9-6 13c-4-4-6-8-6-13s2-9 6-13z"/></svg>
        <b data-t="tabAbroad"></b><span data-t="tileAbroadD"></span>
      </a>
      <a class="card tile" href="#calendar">
        <svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5h14v9a7 7 0 0 1-14 0V5zM11 8H5c0 5 2 7 6 7M25 8h6c0 5-2 7-6 7M18 21v6M11 31h14"/></svg>
        <b data-t="tabPrograms"></b><span data-t="tileProgramsD"></span>
      </a>
    </div>
    <ul class="stats">
      <li><b>75 371</b><span data-t="statGrants"></span></li>
      <li><b id="statUnis"></b><span data-t="statUnis"></span></li>
      <li><b id="statRows"></b><span data-t="statRows"></span></li>
      <li><b id="statPrograms"></b><span data-t="statPrograms"></span></li>
    </ul>
    <!-- Illustration: mountain range and a paper plane, kept quiet.
         The plane sits on the end of the dotted trail and points along it. -->
    <svg class="scene" viewBox="0 0 1200 190" role="img" aria-label="Горы">
      <circle cx="930" cy="70" r="40" fill="#f6d27a"/>
      <path fill="#e8eef7" d="M0 150 150 60l90 60 120-100 130 95 110-70 160 100 140-75 150 85 150-50v85H0z"/>
      <path fill="#c5d3e8" d="M0 190v-40l170-85 120 72 160-110 160 115 120-60 170 85 140-68 160 60v31z"/>
      <path fill="none" stroke="#9db3d6" stroke-width="2.5" stroke-dasharray="2 10" stroke-linecap="round" d="M250 120c120-60 230-76 330-58s170 8 230-34"/>
      <g transform="translate(799.2 35.6) rotate(-35) scale(1.2)">
        <path fill="#1d5fd0" d="M48 0 0-15 11 0z"/>
        <path fill="#8fb1ea" d="M48 0H11L0 15z"/>
      </g>
    </svg>
  </section>

  <section data-panel="unis" hidden>
    <h2 data-t="hUnis"></h2>
    <p class="sub" data-t="pUnis"></p>
    <div id="compare" class="card" hidden></div>
    <div id="cities"></div>
    <div id="uniGrid"></div>
    <div id="cmpBar" hidden></div>
  </section>

  <section data-panel="finder" hidden>
    <h2 data-t="hFinder"></h2>
    <p class="sub" data-t="pFinder"></p>
    <form id="finderForm">
      <label><span data-t="scoreLabel"></span><input type="number" name="score" min="0" max="140" inputmode="numeric" placeholder="0–140"></label>
      <label><span data-t="pairLabel"></span><select name="pair"></select></label>
      <label><span data-t="specLabel"></span><select name="code"></select></label>
      <label class="check"><input type="checkbox" name="mine"><span data-t="mineLabel"></span></label>
    </form>
    <div class="card results">
      <table>
        <thead><tr><th data-t="thProgram"></th><th data-t="thUni"></th><th class="n" data-t="thGrants"></th><th class="n" data-t="thMin"></th><th data-t="thYou"></th><th></th></tr></thead>
        <tbody id="finderBody"></tbody>
      </table>
      <div class="under">
        <button type="button" class="ghost" id="finderMore"></button>
        <button type="button" class="ghost" id="copyLink" data-t="copyLink"></button>
        <span id="copyNote" role="status"></span>
      </div>
    </div>
  </section>

  <section data-panel="grants" hidden>
    <h2 data-t="hGrants" style="margin-bottom:24px"></h2>
    <ul class="tilesrow">
