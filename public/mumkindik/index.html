<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мүмкіндік: конкурсы, вузы и гранты Казахстана</title>
<meta name="description" content="IT-конкурсы и акселераторы Казахстана с дедлайнами, вузы с требованиями IELTS, SAT и ЕНТ, количество грантов по специальностям. Қазақша және орысша.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=PT+Sans:wght@400;700&display=swap">
<style>
:root{
  --sky:#0a84c6; --ink:#0b2545; --paper:#fff; --sun:#ffc629; --poppy:#d93a2b; --mist:#e6f0f8; --muted:#4a5b70;
  --display:"Oswald","Arial Narrow","Roboto Condensed",sans-serif;
  --text:"PT Sans","Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.5 var(--text)}
a{color:inherit}
:focus-visible{outline:3px solid var(--poppy);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.05;margin:0;overflow-wrap:break-word}

/* hero */
.hero{background:var(--sky);color:#fff;overflow:hidden}
.hero .wrap{position:relative;padding-top:20px}
.lang{display:flex;justify-content:flex-end;gap:4px}
.lang button{font:700 15px var(--text);color:#fff;background:none;border:2px solid transparent;padding:8px 12px;min-height:44px;cursor:pointer}
.lang button[aria-pressed=true]{border-color:#fff}
h1{font-size:clamp(64px,15vw,168px);letter-spacing:-.02em;margin-top:8px}
.lead{max-width:36em;font-size:clamp(18px,2.2vw,22px);margin:16px 0 0}
.hero svg{display:block;width:100%;height:auto;margin-top:8px}

/* nav */
nav{position:sticky;top:0;z-index:5;background:var(--ink)}
nav .wrap{display:flex;gap:4px;overflow-x:auto}
nav a{color:#fff;text-decoration:none;padding:10px 20px 10px 16px;white-space:nowrap;border-bottom:4px solid transparent}
nav a b{display:block;font:500 20px/1.2 var(--display)}
nav a span{font-size:14px;opacity:.8}
nav a:hover{background:#17386a}
nav a[aria-current]{border-bottom-color:var(--sun)}

section{padding:64px 0 24px}
h2{font-size:clamp(36px,6vw,60px)}
.intro{max-width:40em;margin:14px 0 28px;font-size:19px}
.head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end}
.head svg{width:190px;height:auto}

/* filters */
.split{display:grid;grid-template-columns:280px minmax(0,1fr);gap:40px;align-items:start}
form{display:grid;gap:12px 16px}
#filters{position:sticky;top:84px;padding:16px;background:var(--mist)}
form label{display:flex;flex-direction:column;gap:4px;font-size:15px;font-weight:700}
select,input[type=search],input[type=number]{font:inherit;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:0;padding:9px 10px;min-height:44px;width:100%}
.checks{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 28px}
.checks .check{flex-direction:row;align-items:center;gap:8px;font-weight:400;font-size:17px;min-height:44px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--ink)}
#found{margin:0;font-weight:700}

/* timetable */
#list{list-style:none;margin:8px 0 0;padding:0;border-top:4px solid var(--ink)}
.row{display:grid;grid-template-columns:120px 1fr 190px;gap:20px;padding:18px 0;border-bottom:1px solid var(--ink)}
.date b{display:block;font:700 28px/1 var(--display);white-space:nowrap}
.date span{color:var(--muted)}
.row h3{font-size:26px}
.row p{margin:4px 0 0}
.row .org{color:var(--muted)}
.row .links{display:flex;flex-wrap:wrap;gap:6px 20px;margin-top:10px;font-weight:700}
.side{text-align:right}
.prize{display:block;font:700 24px/1.1 var(--display)}
.state{display:inline-block;margin-top:6px;padding:2px 8px;background:var(--mist)}
.row.open .state{background:var(--sun)}
.row.open .date b{color:var(--poppy)}
.row.closed .date b,.row.unknown .date b{color:var(--muted)}
.empty{padding:36px 0;font-size:19px}

/* universities */
.finder{display:grid;grid-template-columns:320px minmax(0,1fr);gap:40px;align-items:start;padding:24px;margin-bottom:48px;background:var(--mist)}
.finder>div{min-width:0;overflow-x:auto;padding:5px;margin:-5px}
.finder h3{font-size:30px}
.finder p{margin:10px 0 16px}
.finder table{margin-top:0;background:#fff}
.finder th,.finder td{padding:8px 10px}
.finder th.n,.finder td.n{padding:8px 10px}
.finder td:nth-child(2){overflow-wrap:normal}
.finder .code{color:var(--muted);font-size:14px}
.finder .you{white-space:nowrap;color:var(--muted)}
.finder .pass .you{color:var(--ink);font-weight:700;background:var(--sun)}
.finder .fail .you{color:var(--poppy);font-weight:700}
#finderMore{margin-top:12px;font:700 16px var(--text);color:var(--ink);background:#fff;border:2px solid var(--ink);padding:0 16px;min-height:44px;cursor:pointer}
#unis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:44px 32px;align-items:start}
.uni{min-width:0;scroll-margin-top:96px}
.uni:target{outline:4px solid var(--sun);outline-offset:8px}
.uni figure{position:relative;margin:0 0 12px;aspect-ratio:16/10;background:var(--sky);display:grid;place-items:center;overflow:hidden}
.uni figure span{font:700 30px/1.05 var(--display);color:#fff;text-align:center;padding:16px}
.uni figure img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.uni figcaption{position:absolute;right:0;bottom:0;padding:1px 6px;font-size:12px;background:rgba(11,37,69,.75);color:#fff}
.uni figure:not(:has(img)) figcaption{display:none}
details{margin-top:14px;border-top:1px solid var(--mist)}
summary{cursor:pointer;font-weight:700;padding:10px 0;min-height:44px}
details table{margin-top:4px}
.uni header{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.uni h3{font-size:28px}
.uni header p{margin:0;color:var(--muted);white-space:nowrap}
dl{margin:14px 0 0}
.req{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:8px 0;border-top:1px solid var(--mist)}
.req dt{font:700 19px/1.3 var(--display)}
.req dd{margin:0}
.req.none dd{color:var(--muted)}
.note{margin:12px 0 0;padding:10px 12px;background:var(--mist)}
table{width:100%;border-collapse:collapse;margin-top:16px;font-size:16px}
caption{text-align:left;font-weight:700;padding-bottom:6px}
th{text-align:left;font-weight:700;border-bottom:2px solid var(--ink);padding:4px 6px 4px 0;vertical-align:bottom}
td{padding:6px 6px 6px 0;border-bottom:1px solid var(--mist);vertical-align:top}
th.n,td.n{text-align:right;padding:4px 0 4px 12px;font-variant-numeric:tabular-nums;white-space:nowrap}
td.n{font-weight:700}
td:nth-child(2),th{overflow-wrap:anywhere}
.src{margin:10px 0 0;font-size:15px;color:var(--muted)}

/* grants */
.cols{display:grid;grid-template-columns:5fr 4fr 4fr;gap:40px;margin-top:8px;align-items:start}
.cols h3,.entbox h3{font-size:26px;margin-bottom:12px}
ul.plain{list-style:none;margin:0;padding:0}
#directions li{display:grid;grid-template-columns:1fr 84px;gap:2px 12px;align-items:center;margin-bottom:12px}
#directions .lbl{grid-column:1/-1}
#directions .bar{height:22px;width:var(--w);background:var(--sky)}
#directions li:first-child .bar{background:var(--poppy)}
#directions b{font:700 22px var(--display);text-align:right}
#thresholds li{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:baseline;padding:6px 0;border-top:1px solid var(--mist)}
#thresholds b{font:700 34px/1 var(--display)}
.small{color:var(--muted);font-size:16px;margin:10px 0 0}
#entFacts{margin:0;padding-left:20px}
#entFacts li{margin-bottom:6px}
.entbox{padding:24px;background:var(--sun)}
.entbox svg{width:110px;height:auto;margin-top:12px}

footer{margin-top:56px;padding:28px 0 44px;background:var(--ink);color:#fff}
footer p{margin:0 0 10px;max-width:44em}
footer a{margin-right:16px;white-space:nowrap}

@media (max-width:1100px){
  #unis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols{grid-template-columns:1fr 1fr}
  .finder{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
  .split{grid-template-columns:1fr;gap:20px}
  #filters{position:static}
  .row{grid-template-columns:84px minmax(0,1fr);gap:12px}
  .date b{font-size:20px}
  .side{grid-column:2;text-align:left}
  .prize{display:inline;margin-right:10px}
  #unis,.cols{grid-template-columns:1fr}
  .head{grid-template-columns:minmax(0,1fr)}
  .head svg{width:110px;grid-row:1}
  .finder{padding:16px}
  /* finder rows become stacked blocks: a five-column table does not fit a phone */
  .finder thead{display:none}
  .finder tr{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;padding:10px;border-bottom:1px solid var(--mist)}
  .finder td,.finder td.n{border:0;padding:0;text-align:left;font-weight:400}
  .finder td:nth-child(1),.finder td:nth-child(2),.finder td.you{grid-column:1/-1}
  .finder td:nth-child(1){font-weight:700}
  .finder td[data-l]::before{content:attr(data-l) ": ";color:var(--muted)}
  .finder td.you{justify-self:start;padding:2px 8px;margin-top:4px}
  table{font-size:15px}
  section{padding-top:44px}
  nav a span{display:none}
}
</style>
</head>
<body>
<div class="hero">
  <div class="wrap">
    <div class="lang" role="group" aria-label="Тіл / Язык">
      <button type="button" data-lang="kz">Қазақша</button>
      <button type="button" data-lang="ru">Русский</button>
    </div>
    <h1>Мүмкіндік</h1>
    <p class="lead" data-t="lead"></p>
  </div>
  <!-- Illustration: mountain range over the steppe, a paper plane carrying an application. -->
  <svg viewBox="0 0 1200 300" role="img" aria-label="Горы и степь">
    <circle cx="930" cy="120" r="62" fill="#ffc629"/>
    <g stroke="#ffc629" stroke-width="7" stroke-linecap="round">
      <path d="M930 30v-18M930 228v-18M840 120h-18M1038 120h-18M866 56l-13-13M1007 197l-13-13M994 56l13-13M853 197l13-13"/>
    </g>
    <path fill="#5fb3e4" d="M0 240 150 130l90 70 120-120 130 110 110-80 160 120 140-90 150 100 150-60v120H0z"/>
    <path fill="#0b2545" d="M0 300 0 250 170 150 290 235 450 105 610 240 730 170 900 270 1040 190 1200 260v40z"/>
    <path fill="#fff" d="M450 105 398 148l28-8 22 22 20-24 30 12zM170 150l-46 27 30-4 18 16 16-18 22 6zM730 170l-34 20 24-3 12 14 12-14 20 4zM1040 190l-36 21 26-3 12 13 12-14 22 5z"/>
    <path fill="#ffc629" d="M0 300v-22c200-18 420-10 620 4s400 8 580-10v28z"/>
    <g fill="#d93a2b">
      <circle cx="120" cy="286" r="6"/><circle cx="210" cy="291" r="5"/><circle cx="345" cy="284" r="6"/><circle cx="560" cy="292" r="5"/>
      <circle cx="770" cy="293" r="6"/><circle cx="905" cy="290" r="5"/><circle cx="1090" cy="285" r="6"/>
    </g>
    <path fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round" d="M250 210c120-70 230-90 330-70s170 10 230-40"/>
    <path fill="#fff" d="M800 78 874 60 838 122 826 96z"/>
    <path fill="#c9e3f5" d="M826 96 874 60 834 106z"/>
  </svg>
</div>

<nav aria-label="Разделы">
  <div class="wrap">
    <a href="#programs"><b data-t="navPrograms"></b><span data-t="navProgramsHint"></span></a>
    <a href="#universities"><b data-t="navUnis"></b><span data-t="navUnisHint"></span></a>
    <a href="#grants"><b data-t="navGrants"></b><span data-t="navGrantsHint"></span></a>
  </div>
</nav>

<main class="wrap">
  <section id="programs">
    <h2 data-t="hPrograms"></h2>
    <p class="intro" data-t="pPrograms"></p>
    <div class="split">
    <form id="filters">
      <label><span data-t="search"></span><input type="search" id="q" name="q"></label>
      <label><span data-t="typeLabel"></span>
        <select name="type">
          <option value="" data-t="any"></option>
          <option value="competition" data-t="competition"></option>
          <option value="incubator" data-t="incubator"></option>
          <option value="accelerator" data-t="accelerator"></option>
          <option value="grant" data-t="grant"></option>
        </select>
      </label>
      <label><span data-t="stageLabel"></span>
        <select name="stage">
          <option value="" data-t="stageAny"></option>
          <option value="idea" data-t="idea"></option>
          <option value="mvp" data-t="mvp"></option>
          <option value="growth" data-t="growth"></option>
        </select>
      </label>
      <div class="checks">
        <label class="check"><input type="checkbox" name="prize"><span data-t="prize"></span></label>
        <label class="check"><input type="checkbox" name="open"><span data-t="open"></span></label>
      </div>
    </form>
    <div>
      <p id="found" aria-live="polite"></p>
      <ul id="list"></ul>
    </div>
    </div>
  </section>

  <section id="universities">
    <div class="head">
      <h2 data-t="hUnis"></h2>
      <!-- Illustration: university building with columns. -->
      <svg viewBox="0 0 190 120" aria-hidden="true">
        <rect y="108" width="190" height="12" fill="#0b2545"/>
        <path fill="#0b2545" d="M95 8 180 44H10z"/>
        <circle cx="95" cy="31" r="7" fill="#ffc629"/>
        <rect x="14" y="44" width="162" height="10" fill="#0a84c6"/>
        <g fill="#0b2545"><rect x="24" y="58" width="14" height="46"/><rect x="56" y="58" width="14" height="46"/><rect x="120" y="58" width="14" height="46"/><rect x="152" y="58" width="14" height="46"/></g>
        <path fill="#ffc629" d="M80 104V76a15 15 0 0 1 30 0v28z"/>
      </svg>
    </div>
    <p class="intro" data-t="pUnis"></p>
    <div class="finder">
      <div>
        <h3 data-t="hFinder"></h3>
        <p data-t="pFinder"></p>
        <form id="finder">
          <label><span data-t="scoreLabel"></span><input type="number" name="score" min="0" max="140" inputmode="numeric"></label>
          <label><span data-t="specLabel"></span><select name="code"></select></label>
        </form>
      </div>
      <div>
        <table>
          <thead><tr><th data-t="thProgram"></th><th data-t="thUni"></th><th class="n" data-t="thGrants"></th><th class="n" data-t="thMin"></th><th data-t="thYou"></th></tr></thead>
          <tbody id="finderBody"></tbody>
        </table>
        <button type="button" id="finderMore"></button>
      </div>
    </div>
    <div id="unis"></div>
  </section>

  <section id="grants">
    <h2 data-t="hGrants"></h2>
    <p class="intro" data-t="pGrants"></p>
    <div class="cols">
      <div>
        <h3 data-t="hDirections"></h3>
        <ul class="plain" id="directions"></ul>
        <p class="small" data-t="directionsNote"></p>
      </div>
      <div>
        <h3 data-t="hThresholds"></h3>
        <ul class="plain" id="thresholds"></ul>
        <p class="small" data-t="thresholdsNote"></p>
      </div>
    <div class="entbox">
    <div>
      <h3 data-t="hEnt"></h3>
      <ul id="entFacts"></ul>
    </div>
    <!-- Illustration: answer sheet and pencil. -->
    <svg viewBox="0 0 150 130" aria-hidden="true">
      <rect x="14" y="6" width="96" height="118" fill="#fff" stroke="#0b2545" stroke-width="4"/>
      <g fill="none" stroke="#0b2545" stroke-width="3">
        <circle cx="36" cy="32" r="7"/><circle cx="62" cy="32" r="7"/><circle cx="88" cy="32" r="7"/>
        <circle cx="36" cy="58" r="7"/><circle cx="62" cy="58" r="7"/><circle cx="88" cy="58" r="7"/>
        <circle cx="36" cy="84" r="7"/><circle cx="62" cy="84" r="7"/><circle cx="88" cy="84" r="7"/>
      </g>
      <g fill="#0b2545"><circle cx="62" cy="32" r="7"/><circle cx="36" cy="58" r="7"/><circle cx="88" cy="84" r="7"/></g>
      <path stroke="#0b2545" stroke-width="3" d="M28 106h68"/>
      <g transform="rotate(38 118 70)"><rect x="110" y="20" width="16" height="78" fill="#d93a2b"/><path fill="#fff" stroke="#0b2545" stroke-width="2" d="M110 98h16l-8 18z"/><rect x="110" y="12" width="16" height="10" fill="#0b2545"/></g>
    </svg>
  </div>
    </div>

  </section>
</main>

  <p data-t="foot"></p>
  <p><span data-t="sources"></span>:

  </p>
</div></footer>

</html>
