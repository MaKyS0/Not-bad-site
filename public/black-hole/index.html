<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Чёрная дыра 3D</title>
<meta name="description" content="Интерактивная 3D-модель чёрной дыры: гравитационное линзирование, аккреционный диск, эффект Доплера. Работает в браузере, без установки.">
<meta name="theme-color" content="#000000">
<style>
  :root {
    color-scheme: dark;
    --fg: #e9e6f2;
    --muted: #9a96ad;
    --panel: rgba(14, 12, 24, .62);
    --line: rgba(255, 255, 255, .14);
    --accent: #ffb25a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
  body {
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--fg);
    -webkit-user-select: none; user-select: none;
  }
  canvas {
    position: fixed; inset: 0; width: 100%; height: 100%;
    display: block; cursor: grab; touch-action: none;
  }
  canvas.drag { cursor: grabbing; }
  .ui {
    position: fixed; z-index: 2;
    padding: 10px 14px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  .title {
    top: max(16px, env(safe-area-inset-top)); left: max(16px, env(safe-area-inset-left));
    max-width: min(340px, calc(100vw - 32px));
    pointer-events: none;
  }
  .title h1 { margin: 0 0 2px; font-size: 17px; font-weight: 600; letter-spacing: .01em; }
  .title p { margin: 0; color: var(--muted); font-size: 13px; }
  .controls {
    bottom: max(16px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center;
    width: max-content; max-width: calc(100vw - 32px);
  }
  button, select {
    font: inherit; color: var(--fg);
    background: rgba(255, 255, 255, .06);
    border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 12px; min-height: 40px; cursor: pointer;
  }
  select option { background: #15121f; }
  button:hover, select:hover { background: rgba(255, 255, 255, .12); }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .stat {
    top: max(16px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right));
    color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; pointer-events: none;
  }
  .fallback {
    position: fixed; inset: 0; z-index: 3; display: none;
    align-items: center; justify-content: center; text-align: center; padding: 24px;
  }
  .fallback.show { display: flex; }
  @media (max-width: 520px) {
    .stat { display: none; }
    .title h1 { font-size: 15px; }
  }
</style>
</head>
<body>
<canvas id="c" aria-label="3D-модель чёрной дыры. Перетаскивайте, чтобы вращать, колесо мыши или щипок — приближение."></canvas>

<div class="ui title">
  <h1>Чёрная дыра</h1>
  <p>Тяните, чтобы вращать · колесо / щипок — приближение</p>
</div>
<div class="ui stat" id="stat" aria-hidden="true"></div>

<div class="ui controls" role="toolbar" aria-label="Управление">
  <button id="rotate" aria-pressed="true">Автовращение</button>
  <button id="disk" aria-pressed="true">Аккреционный диск</button>
  <label><span hidden>Качество</span>
    <select id="quality" aria-label="Качество">
      <option value="auto">Качество: авто</option>
      <option value="low">Низкое</option>
      <option value="mid">Среднее</option>
      <option value="high">Высокое</option>
    </select>
  </label>
  <button id="reset">Сброс</button>
  <button id="full">На весь экран</button>
</div>

<div class="fallback" id="fallback">
  <div class="ui">
    <h1 style="margin:0 0 6px;font-size:17px">WebGL недоступен</h1>
    <p style="margin:0;color:var(--muted)">Браузер или устройство не поддерживают WebGL. Попробуйте другой браузер<br>или включите аппаратное ускорение в настройках.</p>
  </div>
</div>

<script id="vs" type="x-shader/x-vertex">
attribute vec2 aPos;
void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
</script>

<script id="fs" type="x-shader/x-fragment">
precision highp float;

uniform vec2  uRes;
uniform float uTime;
uniform vec3  uCam;
uniform vec3  uFwd;
uniform vec3  uRight;
uniform vec3  uUp;
uniform float uFov;
uniform float uDisk;
uniform int   uSteps;

// Units: Schwarzschild radius rs = 1 (event horizon at r = 1,
// photon sphere at r = 1.5, innermost stable orbit at r = 3).
const float R_IN  = 3.0;
const float R_OUT = 13.0;

float hash2(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}
float hash3(vec3 p) {
  p = fract(p * 0.3183099 + 0.1);
  p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash2(i), hash2(i + vec2(1.0, 0.0)), f.x),
             mix(hash2(i + vec2(0.0, 1.0)), hash2(i + vec2(1.0, 1.0)), f.x), f.y);
}
float fbm(vec2 p) {
  float a = 0.5, s = 0.0;
  for (int i = 0; i < 5; i++) {
    s += a * noise(p);
    p = p * 2.03 + 17.1;
    a *= 0.5;
  }
  return s;
}

vec3 starLayer(vec3 d, float scale, float density, float gain) {
  vec3 q = d * scale;
  vec3 id = floor(q);
  vec3 f = fract(q) - 0.5;
  float h = hash3(id);
  if (h < density) return vec3(0.0);
  vec3 off = vec3(hash3(id + 1.3), hash3(id + 2.7), hash3(id + 4.1)) - 0.5;
  float dist = length(f - off * 0.6);
  float k = (h - density) / (1.0 - density);
  float b = smoothstep(0.2, 0.0, dist) * (0.35 + 1.6 * k * k);
  vec3 tint = mix(vec3(1.0, 0.72, 0.5), vec3(0.62, 0.78, 1.0), hash3(id + 9.1));
  return tint * b * gain;
}

vec3 background(vec3 d) {
  vec3 c = starLayer(d, 70.0, 0.92, 1.4) + starLayer(d, 160.0, 0.93, 1.0) + starLayer(d, 320.0, 0.95, 0.9);
  float n = fbm(d.xy * 2.2 + d.z * 3.1);
  float m = fbm(d.yz * 3.0 + vec2(5.0, d.x * 2.0));
  float band = exp(-pow(d.y * 2.6 + 0.25 * sin(d.x * 3.0), 2.0));
  c += vec3(0.30, 0.12, 0.48) * pow(n, 3.0) * 0.9 * (0.2 + band);
  c += vec3(0.05, 0.16, 0.34) * pow(m, 3.0) * 0.8 * (0.2 + band);
  c += vec3(0.9, 0.8, 0.7) * band * 0.035 * (0.4 + n);
  return c;
}

vec3 blackbody(float t) {
  vec3 c = mix(vec3(0.55, 0.07, 0.02), vec3(1.0, 0.5, 0.12), smoothstep(0.0, 0.5, t));
  c = mix(c, vec3(1.0, 0.88, 0.66), smoothstep(0.4, 0.95, t));
  c = mix(c, vec3(0.72, 0.86, 1.0), smoothstep(0.95, 1.7, t));
  return c;
}

vec2 rot(vec2 p, float a) {
  float s = sin(a), c = cos(a);
  return vec2(c * p.x - s * p.y, s * p.x + c * p.y);
}

// Emission of the accretion disk at point `hit` for a ray travelling in direction `v`.
vec4 diskSample(vec3 hit, vec3 v) {
  float r = length(hit.xz);
  if (r < R_IN || r > R_OUT) return vec4(0.0);

  float edge = smoothstep(R_IN, R_IN + 0.35, r) * (1.0 - smoothstep(R_OUT - 4.0, R_OUT, r));
  float omega = 2.2 * pow(r, -1.5);                  // Keplerian: inner parts spin faster
  vec2 q = rot(hit.xz, -uTime * omega * 0.9);
  float turb  = fbm(q * 0.85);
  float fine  = fbm(q * 2.6 + 7.0);
  float rings = 0.6 + 0.4 * noise(vec2(r * 3.2, 1.7));
  float dens  = clamp((0.25 + 1.5 * turb * turb + 0.55 * fine) * rings, 0.0, 1.6);

  float temp = pow(R_IN / r, 0.75);
  float beta = clamp(sqrt(0.5 / (r - 1.0)), 0.0, 0.62);
  vec3 u = normalize(vec3(-hit.z, 0.0, hit.x)) * beta;   // gas velocity
  float g = 1.0 / max(0.25, 1.0 + dot(u, v));            // Doppler factor
  float beam = pow(g, 3.0);

  vec3 col = blackbody(temp * g) * beam * dens * 1.5 * pow(R_IN / r, 0.9);
  float a = clamp(dens * edge * 0.8, 0.0, 1.0);
  return vec4(col * edge, a);
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y * 2.0;
  vec3 v = normalize(uFwd + uRight * (uv.x * uFov) + uUp * (uv.y * uFov));
  vec3 p = uCam;

  vec3 L = cross(p, v);
  float h2 = dot(L, L);                // squared angular momentum (conserved)

  vec3 col = vec3(0.0);
  float T = 1.0;                       // remaining transmittance
  float rmin = 1e9;
  bool captured = false;

  for (int i = 0; i < 420; i++) {
    if (i >= uSteps) { captured = true; break; }   // unresolved orbit around the photon sphere
    float r2 = dot(p, p);
    float r = sqrt(r2);
    rmin = min(rmin, r);
    if (r < 1.0) { captured = true; break; }
    if (r > 48.0 && dot(p, v) > 0.0) break;

    float dt = clamp(0.045 * r, 0.02, 1.1);
    // Schwarzschild null geodesic in Cartesian form: a = -1.5 * rs * h^2 * x / r^5
    v += (-1.5 * h2 / (r2 * r2 * r)) * p * dt;
    vec3 pn = p + v * dt;

    if (uDisk > 0.5 && p.y * pn.y < 0.0) {
      float t = p.y / (p.y - pn.y);
      vec3 hit = mix(p, pn, t);
      vec4 s = diskSample(hit, normalize(v));
      col += T * s.rgb * s.a;
      T *= 1.0 - s.a;
      if (T < 0.02) break;
    }
    p = pn;
  }

  if (!captured) {
    vec3 d = normalize(v);
    vec3 bg = background(d);
    col += T * bg;
    // faint halo of light skimming the photon sphere
    col += T * vec3(1.0, 0.72, 0.45) * 0.07 * exp(-(rmin - 1.5) * 2.2) * (0.35 + 0.65 * uDisk);
  }

  // tone mapping, vignette, dithering
  col = 1.0 - exp(-col * 1.15);
  col = pow(col, vec3(1.0 / 2.2));
  vec2 vq = gl_FragCoord.xy / uRes - 0.5;
  col *= 1.0 - 0.55 * dot(vq, vq);
  col += (hash2(gl_FragCoord.xy + fract(uTime)) - 0.5) / 255.0;
  gl_FragColor = vec4(col, 1.0);
}
</script>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const canvas = $('c');
  const gl = canvas.getContext('webgl', { antialias: false, alpha: false, powerPreference: 'high-performance' })
          || canvas.getContext('experimental-webgl');
  if (!gl) { $('fallback').classList.add('show'); return; }

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  let prog;
  try {
    prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, $('vs').textContent));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, $('fs').textContent));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  } catch (e) {
    console.error(e);
    $('fallback').classList.add('show');
    return;
  }
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  const U = {};
  for (const n of ['uRes', 'uTime', 'uCam', 'uFwd', 'uRight', 'uUp', 'uFov', 'uDisk', 'uSteps'])
    U[n] = gl.getUniformLocation(prog, n);

  // ---- camera state -------------------------------------------------------
  const HOME = { yaw: 0.6, pitch: 0.17, dist: 24 };
  const cam = { ...HOME };
  const target = { ...HOME };
  const MIN_DIST = 4, MAX_DIST = 60, MAX_PITCH = 1.45;
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  let autoRotate = true, disk = true, lastInput = -1e9;

  // ---- quality ------------------------------------------------------------
  const PRESETS = { low: { scale: 0.5, steps: 200 }, mid: { scale: 0.75, steps: 280 }, high: { scale: 1, steps: 380 } };
  let quality = 'auto', scale = 0.7, steps = 280;
  const maxDpr = Math.min(window.devicePixelRatio || 1, 2);

  function resize() {
    const w = Math.max(1, Math.floor(canvas.clientWidth * maxDpr * scale));
    const h = Math.max(1, Math.floor(canvas.clientHeight * maxDpr * scale));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w; canvas.height = h;
      gl.viewport(0, 0, w, h);
    }
  }

  // ---- input --------------------------------------------------------------
  const pointers = new Map();
  let pinchDist = 0;
  const touched = () => { lastInput = performance.now(); };

  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    canvas.classList.add('drag');
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinchDist = Math.hypot(a.x - b.x, a.y - b.y);
    }
    touched();
  });
  canvas.addEventListener('pointermove', (e) => {
    const p = pointers.get(e.pointerId);
    if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (pointers.size === 1) {
      target.yaw -= dx * 0.006;
      target.pitch = clamp(target.pitch + dy * 0.006, -MAX_PITCH, MAX_PITCH);
    } else if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinchDist > 0) target.dist = clamp(target.dist * (pinchDist / d), MIN_DIST, MAX_DIST);
      pinchDist = d;
    }
    touched();
  });
  const release = (e) => {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinchDist = 0;
    if (pointers.size === 0) canvas.classList.remove('drag');
    touched();
  };
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    target.dist = clamp(target.dist * Math.exp(e.deltaY * 0.0012), MIN_DIST, MAX_DIST);
    touched();
  }, { passive: false });
  canvas.addEventListener('dblclick', () => Object.assign(target, HOME));
  window.addEventListener('keydown', (e) => {
    const k = e.key;
    if (k === 'ArrowLeft') target.yaw += 0.08;
    else if (k === 'ArrowRight') target.yaw -= 0.08;
    else if (k === 'ArrowUp') target.pitch = clamp(target.pitch - 0.06, -MAX_PITCH, MAX_PITCH);
    else if (k === 'ArrowDown') target.pitch = clamp(target.pitch + 0.06, -MAX_PITCH, MAX_PITCH);
    else if (k === '+' || k === '=') target.dist = clamp(target.dist * 0.9, MIN_DIST, MAX_DIST);
    else if (k === '-') target.dist = clamp(target.dist / 0.9, MIN_DIST, MAX_DIST);
    else return;
    touched();
  });

  // ---- controls -----------------------------------------------------------
  const toggle = (btn, fn) => btn.addEventListener('click', () => {
    const on = btn.getAttribute('aria-pressed') !== 'true';
    btn.setAttribute('aria-pressed', String(on));
    fn(on);
  });
  toggle($('rotate'), (on) => { autoRotate = on; });
  toggle($('disk'), (on) => { disk = on; });
  $('quality').addEventListener('change', (e) => {
    quality = e.target.value;
    if (quality !== 'auto') ({ scale, steps } = PRESETS[quality]);
    else { scale = 0.7; steps = 280; }
    slow = fast = 0;
  });
  $('reset').addEventListener('click', () => Object.assign(target, HOME));
  const fsBtn = $('full');
  if (!document.documentElement.requestFullscreen) fsBtn.hidden = true;
  fsBtn.addEventListener('click', () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  });

  // ---- render loop --------------------------------------------------------
  const stat = $('stat');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let prev = performance.now(), ema = 16, slow = 0, fast = 0, statAt = 0;

  function frame(now) {
    const dt = Math.min(0.1, (now - prev) / 1000);
    prev = now;
    ema += (dt * 1000 - ema) * 0.08;

    // adaptive resolution
    if (quality === 'auto') {
      slow = ema > 30 ? slow + 1 : 0;
      fast = ema < 14 ? fast + 1 : 0;
      if (slow > 20 && scale > 0.35) { scale = Math.max(0.35, scale * 0.85); slow = 0; }
      else if (slow > 20 && steps > 200) { steps -= 40; slow = 0; }
      else if (fast > 90 && scale < 1) { scale = Math.min(1, scale * 1.12); fast = 0; }
    }

    if (autoRotate && !reduceMotion && now - lastInput > 1500 && pointers.size === 0) target.yaw += dt * 0.12;
    const k = 1 - Math.exp(-dt * 9);
    cam.yaw += (target.yaw - cam.yaw) * k;
    cam.pitch += (target.pitch - cam.pitch) * k;
    cam.dist += (target.dist - cam.dist) * k;

    resize();

    const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
    const pos = [cam.dist * cp * Math.sin(cam.yaw), cam.dist * sp, cam.dist * cp * Math.cos(cam.yaw)];
    const fwd = pos.map((x) => -x / cam.dist);
    // right = normalize(cross(fwd, worldUp)), up = cross(right, fwd)
    let right = [-fwd[2], 0, fwd[0]];
    const rl = Math.hypot(right[0], right[2]) || 1;
    right = [right[0] / rl, 0, right[2] / rl];
    const up = [
      right[1] * fwd[2] - right[2] * fwd[1],
      right[2] * fwd[0] - right[0] * fwd[2],
      right[0] * fwd[1] - right[1] * fwd[0],
    ];

    gl.uniform2f(U.uRes, canvas.width, canvas.height);
    gl.uniform1f(U.uTime, now / 1000);
    gl.uniform3f(U.uCam, pos[0], pos[1], pos[2]);
    gl.uniform3f(U.uFwd, fwd[0], fwd[1], fwd[2]);
    gl.uniform3f(U.uRight, right[0], right[1], right[2]);
    gl.uniform3f(U.uUp, up[0], up[1], up[2]);
    gl.uniform1f(U.uFov, Math.tan(0.5 * (canvas.clientWidth < canvas.clientHeight ? 1.25 : 0.95)));
    gl.uniform1f(U.uDisk, disk ? 1 : 0);
    gl.uniform1i(U.uSteps, steps);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    if (now - statAt > 500) {
      statAt = now;
      stat.textContent = `${Math.round(1000 / ema)} FPS · ${canvas.width}×${canvas.height} · r = ${cam.dist.toFixed(1)} rs`;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  canvas.addEventListener('webglcontextlost', (e) => e.preventDefault());
  canvas.addEventListener('webglcontextrestored', () => location.reload());
})();
</script>
</body>
</html>
