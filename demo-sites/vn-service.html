:root{

  --max:1140px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--concrete);color:var(--ink);font:17px/1.6 "Fira Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:74px}
a{color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:3px solid var(--kz);outline-offset:3px}
.wrap{max-width:var(--max);margin:0 auto;padding:0 16px}

/* demo marks */
.wm{position:fixed;inset:0;z-index:999;pointer-events:none;

.tape{background:repeating-linear-gradient(-45deg,var(--yellow) 0 16px,var(--asphalt) 16px 32px);padding:4px 0}
.tape p{background:var(--asphalt);color:var(--yellow);text-align:center;font-size:14px;font-weight:700;padding:6px 12px}

/* header */
header{background:var(--concrete);border-bottom:2px solid var(--asphalt);position:sticky;top:0;z-index:40}
.nav{display:flex;align-items:center;gap:20px;height:68px}
.plate{display:inline-flex;align-items:stretch;border:2.5px solid var(--asphalt);border-radius:6px;background:var(--paper);text-decoration:none;height:40px;overflow:hidden}
.plate .fl{background:var(--kz);color:#fff;font:700 10px/1 "Fira Sans";display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0 5px 5px;gap:3px}
.plate .fl::before{content:"";width:10px;height:10px;border-radius:50%;background:#f7d117}
.plate b{font:800 25px/36px var(--cond);letter-spacing:.06em;padding:0 10px}
.nav nav{display:flex;gap:24px;margin-left:auto;font-weight:500}
.nav nav a{text-decoration:none}
.nav nav a:hover{text-decoration:underline;text-underline-offset:4px}
.hphone{font-weight:700;text-decoration:none;white-space:nowrap}
.lang{display:flex;border:2px solid var(--asphalt);border-radius:6px;overflow:hidden;font-weight:700;font-size:14px}
.lang button{background:none;border:0;padding:5px 10px;cursor:pointer;font:inherit;color:var(--ink)}
.lang button[aria-pressed=true]{background:var(--asphalt);color:var(--paper)}
@media(max-width:900px){.nav nav,.hphone{display:none}.lang{margin-left:auto}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:54px;padding:0 24px;border-radius:8px;font:700 17px/1 "Fira Sans";text-decoration:none;border:2px solid var(--asphalt);cursor:pointer}
.btn svg{width:20px;height:20px;flex:none}
.b-call{background:var(--yellow);color:var(--asphalt)}
.b-wa{background:var(--wa);border-color:var(--wa);color:#fff}
.b-line{background:transparent;color:var(--ink)}
.btn:hover{filter:brightness(.95)}
.btn:active{transform:translateY(1px)}

/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:0;border-bottom:2px solid var(--asphalt)}
.hero-text{padding:56px 48px 56px max(16px,calc((100vw - var(--max))/2 + 16px))}
.status{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.status i{width:10px;height:10px;border-radius:50%;background:#1a9d4b}
.status.off i{background:#9a9d97}
h1{font:800 clamp(46px,7.4vw,92px)/.95 var(--cond);letter-spacing:-.005em;margin:18px 0 22px;max-width:11ch;text-wrap:balance}
.sub{font-size:19px;max-width:36ch;color:#33383e}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.score{display:flex;align-items:center;gap:14px;margin-top:34px;padding-top:22px;border-top:2px solid var(--asphalt);max-width:460px}
.score strong{font:800 46px/1 var(--cond)}
.score span{color:var(--muted);font-size:15px;line-height:1.35}
.stars,.score .stars{color:#c88f00;letter-spacing:2px}
.hero-photo{position:relative;min-height:520px;background:var(--asphalt)}
.hero-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%}
.hero-photo figcaption{position:absolute;left:0;bottom:0;background:var(--asphalt);color:var(--paper);font-size:14px;padding:8px 14px}
@media(max-width:900px){
  .hero{grid-template-columns:1fr}
  .hero-text{padding:36px 16px 40px}
  .hero-photo{min-height:220px;order:-1}
  .hero-text{padding-top:24px}
}

/* sections */
section{padding:80px 0}
h2{font:800 clamp(34px,5vw,54px)/1 var(--cond);margin-bottom:12px}
.intro{color:#33383e;max-width:52ch;margin-bottom:36px}

/* work order rows */
.order{border-top:2px solid var(--asphalt)}
.line{display:grid;grid-template-columns:minmax(220px,1fr) 1.4fr auto;gap:8px 32px;align-items:baseline;padding:22px 0;border-bottom:1px solid var(--rule)}
.line h3{font:600 26px/1.1 var(--cond)}
.line p{color:#3c4148}
.line a{font-weight:700;color:#0d6e86;white-space:nowrap;text-underline-offset:4px}
@media(max-width:760px){.line{grid-template-columns:1fr}}

/* parts */
.parts{background:var(--asphalt);color:var(--paper)}
.parts .intro{color:#c3c6c1}
.parts-grid{display:block}.parts .bins{max-width:820px}
@media(max-width:900px){.parts-grid{grid-template-columns:1fr}}
.bins{display:flex;flex-wrap:wrap;gap:10px}
.bin{position:relative;background:var(--paper);color:var(--ink);font-weight:500;padding:9px 14px 9px 30px;border-radius:3px;font-size:16px}
.bin::before{content:"";position:absolute;left:11px;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;background:var(--asphalt)}
.facts{margin-top:40px;display:grid;gap:18px;max-width:560px}
.facts p{padding-left:18px;border-left:4px solid var(--yellow);color:#c3c6c1}
.facts strong{display:block;color:var(--paper);font-size:18px}
.parts figure img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:4px}

/* ask */
.ask-grid{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
@media(max-width:900px){.ask-grid{grid-template-columns:1fr;gap:24px}}
.ask form{background:var(--paper);border:2px solid var(--asphalt);border-radius:8px;padding:24px;display:grid;gap:8px}
.ask label{font-weight:700;font-size:15px;margin-top:6px}
.ask select,.ask input{width:100%;height:52px;border:2px solid var(--rule);border-radius:6px;background:#fff;color:var(--ink);padding:0 14px;font:inherit}
.ask select:focus,.ask input:focus{border-color:var(--asphalt);outline:none}
.ask .btn{margin-top:12px}
.ask small{color:var(--muted);font-size:14px}

/* reviews */

.rv-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:48px;align-items:center}
@media(max-width:900px){.rv-grid{grid-template-columns:1fr}}
blockquote{font:600 clamp(26px,3.4vw,36px)/1.2 var(--cond);margin:24px 0 16px;max-width:30ch}
cite{font-style:normal;color:var(--muted)}
.rv-grid img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:4px}
.rv-link{margin-top:28px}

/* contacts */
.ct-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 48px}

footer{background:var(--asphalt);color:#b5b8b3;font-size:14px;padding:26px 0 30px}

.bar .btn svg{width:18px;height:18px}

const I = {
  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>',
  wa:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.5 14.4c-.3-.1-1.8-.9-2-1-.3-.1-.5-.1-.7.1l-.9 1.1c-.2.2-.3.2-.6.1-.3-.1-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.4-.5.3-.5v-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.8-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.2-.3-.3-.6-.4zM12 21.8c-1.8 0-3.5-.5-5-1.4l-.4-.2-3.7 1 1-3.6-.2-.4A9.8 9.8 0 1 1 12 21.8zm8.4-18.2A11.8 11.8 0 0 0 1.7 17.9L0 24l6.3-1.6A11.8 11.8 0 0 0 23.8 12c0-3.2-1.2-6.1-3.4-8.4z"/></svg>',

const $ = id => document.getElementById(id);
const wa = text => "https://wa.me/"+DATA.whatsapp+"?text="+encodeURIComponent(text);
const tel = "tel:"+DATA.phone.replace(/[^\d+]/g,"");
let L = "ru";
try { L = localStorage.getItem("lang") || ((navigator.language||"").startsWith("kk") ? "kz" : "ru"); } catch(e) {}

function render(){
  const t = T[L];
  document.documentElement.lang = L === "kz" ? "kk" : "ru";
  document.querySelectorAll("[data-t]").forEach(e => e.textContent = t[e.dataset.t]);
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === L));
  $("brand").textContent = DATA.name;
  $("hphone").textContent = DATA.phone; $("hphone").href = tel;
  $("sub").textContent = DATA.sub[L];
  for (const id of ["call1","call2"]) { $(id).href = tel; $(id).innerHTML = I.phone + t.call; }
  for (const id of ["wa1","wa2"]) { $(id).href = wa(t.waHi); $(id).innerHTML = I.wa + t.wa; }
  for (const id of ["route1","route2","route3"]) { $(id).href = DATA.gis; $(id).innerHTML = I.route + (id === "route3" ? t.routeShort : t.route); }

  // открыто ли сейчас — по времени Астаны (UTC+5)
  const now = new Date(Date.now() + (new Date().getTimezoneOffset() + 300) * 60000);
  const h = now.getHours() + now.getMinutes()/60, H = DATA.hours;
  const isOpen = h >= H.open && h < H.close;
  $("open").className = "status" + (isOpen ? "" : " off");
  $("open").lastElementChild.textContent = isOpen ? t.open + H.close + ":00" : t.closed + H.open + ":00";

  $("rating").textContent = DATA.rating;
  $("rcount").textContent = DATA.reviewsCount + t.reviews;

  $("svc").innerHTML = DATA.services.map(s => `<div class="line"><h3>${s[L][0]}</h3><p>${s[L][1]}</p><a href="${wa(t.waMsg + s[L][0])}" target="_blank" rel="noopener">${t.ask}</a></div>`).join("");
  $("bins").innerHTML = DATA.parts[L].map(p => `<span class="bin">${p}</span>`).join("");
  $("facts").innerHTML = DATA.facts[L].map(f => `<p><strong>${f[0]}</strong>${f[1]}</p>`).join("");

  $("q1").innerHTML = DATA.services.map(s => `<option>${s[L][0]}</option>`).join("") + `<option>${t.other}</option>`;
  $("q2").placeholder = t.carPh;
  $("askbtn").innerHTML = I.wa + t.askBtn;

  $("revs").innerHTML = DATA.reviews.map(r => `<blockquote>«${r.text}»</blockquote><cite><span class="stars">★★★★★</span> ${r.name}, ${r.date[L]}, 2ГИС</cite>`).join("");
  $("allrev").href = DATA.gis; $("allrev").textContent = t.allRev;

  $("ph1").src = DATA.photos[0]; $("ph3").src = DATA.photos[1];
  $("ph1").alt = $("ph3").alt = t.cap;

  $("addr").textContent = DATA.address[L];
  $("district").textContent = DATA.district[L];
  $("ctlist").innerHTML = `
    <dt>${t.tel}</dt><dd><a href="${tel}">${DATA.phone}</a></dd>
    <dt>WhatsApp</dt><dd><a href="${wa(t.waHi)}" target="_blank" rel="noopener">${DATA.phone}</a></dd>
    <dt>${t.hrs}</dt><dd>${DATA.hours.label[L]}</dd>`;
  $("copy").textContent = "© " + new Date().getFullYear() + " " + DATA.name + ", " + DATA.city[L];
}

document.querySelectorAll(".lang button").forEach(b => b.onclick = () => { L = b.dataset.l; try { localStorage.setItem("lang", L); } catch(e) {} render(); });
$("askf").onsubmit = e => {
  e.preventDefault(); const t = T[L];
  const car = $("q2").value.trim();
  window.open(wa(t.waMsg + $("q1").value + (car ? t.waCar + car : "")), "_blank");
};
render();
</script>
