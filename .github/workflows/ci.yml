name: CI

on:
  pull_request:
  push:
    branches-ignore: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # onnxruntime-node (pulled in by transformers.js) downloads native binaries we never use
      - run: npm ci --ignore-scripts
      - name: Cache speech models
        uses: actions/cache@v4
        with:
          path: public/models
          key: whisper-${{ hashFiles('scripts/fetch-models.mjs') }}
      - run: npm test
      - name: Lyceum registry unit tests
        run: node --test lyceum/tests/unit/*.test.mjs
      - run: npm run build
      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium
      - name: E2E (real browser, GitHub-Pages-like sub-path)
        run: npm run test:e2e
      - name: Lyceum registry E2E (real browser, GitHub-Pages-like sub-path)
        run: node lyceum/tests/e2e/run.mjs
