block.rapid-turret-rapid-1.name = Rapid I
block.rapid-turret-rapid-1.description = Tier 1 rapid-fire turret. Two barrels and a huge rate of fire.
block.rapid-turret-rapid-2.name = Rapid II
block.rapid-turret-rapid-2.description = Tier 2 rapid-fire turret. Three barrels, more damage and range.
block.rapid-turret-rapid-3.name = Rapid III
block.rapid-turret-rapid-3.description = Tier 3 rapid-fire turret. Heavy barrels and tracer rounds.
block.rapid-turret-rapid-4.name = Rapid IV
block.rapid-turret-rapid-4.description = Tier 4 rapid-fire turret. Four barrels, accepts thorium.
block.rapid-turret-rapid-5.name = Rapid V
block.rapid-turret-rapid-5.description = Tier 5 rapid-fire turret. Five barrels and heavy rounds.
block.rapid-turret-rapid-6.name = Rapid VI
block.rapid-turret-rapid-6.description = Top of the line. Six barrels, surge rounds arc lightning.
block.rapid-turret-rapid-wall-1.name = Rapid Wall I
block.rapid-turret-rapid-wall-1.description = Basic reinforced wall. Cheap and sturdy.
block.rapid-turret-rapid-wall-1-large.name = Large Rapid Wall I
block.rapid-turret-rapid-wall-1-large.description = Basic reinforced wall. Cheap and sturdy. Covers 2x2 tiles.
block.rapid-turret-rapid-wall-2.name = Rapid Wall II
block.rapid-turret-rapid-wall-2.description = Titanium-plated wall with much more health.
block.rapid-turret-rapid-wall-2-large.name = Large Rapid Wall II
block.rapid-turret-rapid-wall-2-large.description = Titanium-plated wall with much more health. Covers 2x2 tiles.
block.rapid-turret-rapid-wall-3.name = Rapid Wall III
block.rapid-turret-rapid-wall-3.description = Thorium-armoured wall that shrugs off weak bullets.
block.rapid-turret-rapid-wall-3-large.name = Large Rapid Wall III
block.rapid-turret-rapid-wall-3-large.description = Thorium-armoured wall that shrugs off weak bullets. Covers 2x2 tiles.
block.rapid-turret-rapid-wall-4.name = Rapid Wall IV
block.rapid-turret-rapid-wall-4.description = Absorbs lasers and blocks power node links.
block.rapid-turret-rapid-wall-4-large.name = Large Rapid Wall IV
block.rapid-turret-rapid-wall-4-large.description = Absorbs lasers and blocks power node links. Covers 2x2 tiles.
block.rapid-turret-rapid-wall-5.name = Rapid Wall V
block.rapid-turret-rapid-wall-5.description = Deflects bullets and arcs lightning at attackers.
block.rapid-turret-rapid-wall-5-large.name = Large Rapid Wall V
block.rapid-turret-rapid-wall-5-large.description = Deflects bullets and arcs lightning at attackers. Covers 2x2 tiles.
block.rapid-turret-rapid-drill-1.name = Rapid Drill I
block.rapid-turret-rapid-drill-1.description = Mines ore up to hardness 2 (copper, lead, sand, coal). Water speeds it up.
block.rapid-turret-rapid-drill-2.name = Rapid Drill II
block.rapid-turret-rapid-drill-2.description = Mines ore up to hardness 3, including titanium. Water speeds it up.
block.rapid-turret-rapid-drill-3.name = Rapid Drill III
block.rapid-turret-rapid-drill-3.description = Powered drill that mines ore up to hardness 4, including thorium. Water speeds it up.
block.rapid-turret-rapid-drill-4.name = Rapid Drill IV
block.rapid-turret-rapid-drill-4.description = Heavy powered drill that mines ore up to hardness 5. Water speeds it up.
block.rapid-turret-rapid-drill-5.name = Rapid Drill V
block.rapid-turret-rapid-drill-5.description = Top-tier powered drill that mines ore up to hardness 6. Water speeds it up.
block.rapid-turret-rapid-forge.name = Rapid Forge
block.rapid-turret-rapid-forge.description = Builds the Rapid mechs. Each unit tier needs more expensive materials.
unit.rapid-turret-pellet.name = Pellet
unit.rapid-turret-pellet.description = Tier 1 mech. A light scout with twin rapid-fire guns.
unit.rapid-turret-burst.name = Burst
unit.rapid-turret-burst.description = Tier 2 mech. Fires fast bursts from double-barrelled guns.
unit.rapid-turret-volley.name = Volley
unit.rapid-turret-volley.description = Tier 3 mech. An armoured line fighter that fires tracer rounds.
unit.rapid-turret-barrage.name = Barrage
unit.rapid-turret-barrage.description = Tier 4 mech. A heavy assault walker with triple-barrel guns.
unit.rapid-turret-storm.name = Storm
unit.rapid-turret-storm.description = Tier 5 mech. A colossal walker whose four-barrel guns pierce armour.
block.rapid-turret-rapid-conveyor-1.name = Rapid Conveyor I
block.rapid-turret-rapid-conveyor-1.description = Tier 1 conveyor. Moves 7 items per second.
block.rapid-turret-rapid-conveyor-2.name = Rapid Conveyor II
block.rapid-turret-rapid-conveyor-2.description = Tier 2 conveyor. Moves 12 items per second.
block.rapid-turret-rapid-conveyor-3.name = Rapid Conveyor III
block.rapid-turret-rapid-conveyor-3.description = Tier 3 conveyor. Moves 16 items per second.
block.rapid-turret-rapid-conveyor-4.name = Rapid Conveyor IV
block.rapid-turret-rapid-conveyor-4.description = Tier 4 conveyor. Moves 21 items per second.
block.rapid-turret-rapid-conveyor-5.name = Rapid Conveyor V
block.rapid-turret-rapid-conveyor-5.description = Tier 5 conveyor. Moves 26 items per second.
unit.rapid-turret-dart.name = Dart
unit.rapid-turret-dart.description = Tier 1 gunship. A fast light fighter that circles its target.
unit.rapid-turret-swift.name = Swift
unit.rapid-turret-swift.description = Tier 2 gunship. A quick strafing fighter with heavier guns.
unit.rapid-turret-falcon.name = Falcon
unit.rapid-turret-falcon.description = Tier 3 gunship. An armoured fighter that fires tracer rounds from low altitude.
unit.rapid-turret-tempest.name = Tempest
unit.rapid-turret-tempest.description = Tier 4 gunship. A heavy gunship carrying two turning turrets.
unit.rapid-turret-hurricane.name = Hurricane
unit.rapid-turret-hurricane.description = Tier 5 gunship. A colossal gunship with four turning turrets whose rounds pierce armour.
block.rapid-turret-rapid-hangar.name = Rapid Hangar
block.rapid-turret-rapid-hangar.description = Builds the Rapid gunships. Each unit tier needs more expensive materials.
block.rapid-turret-rapid-pulse-1.name = Pulse I
block.rapid-turret-rapid-pulse-1.description = Tiny laser turret. Needs power instead of ammo and fires 12 bolts a second.
block.rapid-turret-rapid-pulse-2.name = Pulse II
block.rapid-turret-rapid-pulse-2.description = Twin emitters, 20 laser bolts a second, no ammo needed.
block.rapid-turret-rapid-pulse-3.name = Pulse III
block.rapid-turret-rapid-pulse-3.description = Three emitters, 20 bolts a second; bolts pierce through two targets.
block.rapid-turret-rapid-pulse-4.name = Pulse IV
block.rapid-turret-rapid-pulse-4.description = Four emitters, heavy bolts that pierce three targets. Very power hungry.
block.rapid-turret-rapid-buckshot-1.name = Buckshot I
block.rapid-turret-rapid-buckshot-1.description = Tiny rapid shotgun. Short range, three pellets per shot. Accepts scrap.
block.rapid-turret-rapid-buckshot-2.name = Buckshot II
block.rapid-turret-rapid-buckshot-2.description = Four pellets per shot, devastating up close.
block.rapid-turret-rapid-buckshot-3.name = Buckshot III
block.rapid-turret-rapid-buckshot-3.description = Five pellets per shot; thorium pellets pierce and push enemies back.
block.rapid-turret-rapid-buckshot-4.name = Buckshot IV
block.rapid-turret-rapid-buckshot-4.description = Seven heavy pellets per shot. Shreds anything that gets close.
block.rapid-turret-rapid-shield-wall-1.name = Aegis Wall I
block.rapid-turret-rapid-shield-wall-1.description = Wall with a small energy shield. Needs power and passes it to neighbouring shield walls.
block.rapid-turret-rapid-shield-wall-1-large.name = Large Aegis Wall I
block.rapid-turret-rapid-shield-wall-1-large.description = Wall with a small energy shield. Needs power and passes it to neighbouring shield walls. Covers 2x2 tiles.
block.rapid-turret-rapid-shield-wall-2.name = Aegis Wall II
block.rapid-turret-rapid-shield-wall-2.description = Titanium shield wall with a stronger, faster shield.
block.rapid-turret-rapid-shield-wall-2-large.name = Large Aegis Wall II
block.rapid-turret-rapid-shield-wall-2-large.description = Titanium shield wall with a stronger, faster shield. Covers 2x2 tiles.
block.rapid-turret-rapid-shield-wall-3.name = Aegis Wall III
block.rapid-turret-rapid-shield-wall-3.description = Armoured thorium shield wall.
block.rapid-turret-rapid-shield-wall-3-large.name = Large Aegis Wall III
block.rapid-turret-rapid-shield-wall-3-large.description = Armoured thorium shield wall. Covers 2x2 tiles.
block.rapid-turret-rapid-shield-wall-4.name = Aegis Wall IV
block.rapid-turret-rapid-shield-wall-4.description = The strongest shield; the wall under it also deflects bullets.
block.rapid-turret-rapid-shield-wall-4-large.name = Large Aegis Wall IV
block.rapid-turret-rapid-shield-wall-4-large.description = The strongest shield; the wall under it also deflects bullets. Covers 2x2 tiles.
block.rapid-turret-rapid-regen-wall-1.name = Regen Wall I
block.rapid-turret-rapid-regen-wall-1.description = Wall that slowly repairs itself. No power needed.
block.rapid-turret-rapid-regen-wall-1-large.name = Large Regen Wall I
block.rapid-turret-rapid-regen-wall-1-large.description = Wall that slowly repairs itself. No power needed. Covers 2x2 tiles.
block.rapid-turret-rapid-regen-wall-2.name = Regen Wall II
block.rapid-turret-rapid-regen-wall-2.description = Titanium wall that repairs itself faster.
block.rapid-turret-rapid-regen-wall-2-large.name = Large Regen Wall II
block.rapid-turret-rapid-regen-wall-2-large.description = Titanium wall that repairs itself faster. Covers 2x2 tiles.
block.rapid-turret-rapid-regen-wall-3.name = Regen Wall III
block.rapid-turret-rapid-regen-wall-3.description = Armoured wall with the fastest self-repair.
block.rapid-turret-rapid-regen-wall-3-large.name = Large Regen Wall III
block.rapid-turret-rapid-regen-wall-3-large.description = Armoured wall with the fastest self-repair. Covers 2x2 tiles.
unit.rapid-turret-skiff.name = Skiff
unit.rapid-turret-skiff.description = Tier 1 warship. A small patrol boat with one rapid-fire turret.
unit.rapid-turret-cutter.name = Cutter
unit.rapid-turret-cutter.description = Tier 2 warship. A twin turret on the bow and a flak gun on the stern that shoots down aircraft.
unit.rapid-turret-corvette.name = Corvette
unit.rapid-turret-corvette.description = Tier 3 warship. Two twin turrets and a pair of flak guns behind thick armour.
unit.rapid-turret-frigate.name = Frigate
unit.rapid-turret-frigate.description = Tier 4 warship. A floating fortress with two triple turrets and four flak guns.
unit.rapid-turret-dreadnought.name = Dreadnought
unit.rapid-turret-dreadnought.description = Tier 5 warship. Three quad turrets fire piercing rounds while four heavy flak guns clear the sky.
block.rapid-turret-rapid-shipyard.name = Rapid Shipyard
block.rapid-turret-rapid-shipyard.description = Builds the Rapid warships. Can stand on deep water near the shore; the exit must face water.
