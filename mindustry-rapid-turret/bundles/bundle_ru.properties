block.rapid-turret-rapid-1.name = Rapid I
block.rapid-turret-rapid-1.description = Скорострельная турель 1 тира. Два ствола, огромный темп огня.
block.rapid-turret-rapid-2.name = Rapid II
block.rapid-turret-rapid-2.description = Скорострельная турель 2 тира. Три ствола, выше урон и дальность.
block.rapid-turret-rapid-3.name = Rapid III
block.rapid-turret-rapid-3.description = Скорострельная турель 3 тира. Тяжёлые стволы и трассирующие пули.
block.rapid-turret-rapid-4.name = Rapid IV
block.rapid-turret-rapid-4.description = Скорострельная турель 4 тира. Четыре ствола, принимает торий.
block.rapid-turret-rapid-5.name = Rapid V
block.rapid-turret-rapid-5.description = Скорострельная турель 5 тира. Пять стволов, выстрел каждый тик.
block.rapid-turret-rapid-6.name = Rapid VI
block.rapid-turret-rapid-6.description = Вершина линейки. Шесть стволов, два выстрела за тик, пули из кинетического сплава бьют молниями.
block.rapid-turret-rapid-wall-1.name = Стена Rapid I
block.rapid-turret-rapid-wall-1.description = Базовая усиленная стена. Дешёвая и прочная.
block.rapid-turret-rapid-wall-1-large.name = Большая стена Rapid I
block.rapid-turret-rapid-wall-1-large.description = Базовая усиленная стена. Дешёвая и прочная. Занимает 2x2 клетки.
block.rapid-turret-rapid-wall-2.name = Стена Rapid II
block.rapid-turret-rapid-wall-2.description = Стена с титановой обшивкой и большим запасом прочности.
block.rapid-turret-rapid-wall-2-large.name = Большая стена Rapid II
block.rapid-turret-rapid-wall-2-large.description = Стена с титановой обшивкой и большим запасом прочности. Занимает 2x2 клетки.
block.rapid-turret-rapid-wall-3.name = Стена Rapid III
block.rapid-turret-rapid-wall-3.description = Стена с ториевой бронёй, не боится слабых пуль.
block.rapid-turret-rapid-wall-3-large.name = Большая стена Rapid III
block.rapid-turret-rapid-wall-3-large.description = Стена с ториевой бронёй, не боится слабых пуль. Занимает 2x2 клетки.
block.rapid-turret-rapid-wall-4.name = Стена Rapid IV
block.rapid-turret-rapid-wall-4.description = Поглощает лазеры и не пропускает связи узлов питания.
block.rapid-turret-rapid-wall-4-large.name = Большая стена Rapid IV
block.rapid-turret-rapid-wall-4-large.description = Поглощает лазеры и не пропускает связи узлов питания. Занимает 2x2 клетки.
block.rapid-turret-rapid-wall-5.name = Стена Rapid V
block.rapid-turret-rapid-wall-5.description = Отражает пули и бьёт атакующих молниями.
block.rapid-turret-rapid-wall-5-large.name = Большая стена Rapid V
block.rapid-turret-rapid-wall-5-large.description = Отражает пули и бьёт атакующих молниями. Занимает 2x2 клетки.
block.rapid-turret-rapid-drill-1.name = Бур Rapid I
block.rapid-turret-rapid-drill-1.description = Добывает руду до твёрдости 2 (медь, свинец, песок, уголь). Вода ускоряет работу.
block.rapid-turret-rapid-drill-2.name = Бур Rapid II
block.rapid-turret-rapid-drill-2.description = Добывает руду до твёрдости 3, включая титан. Вода ускоряет работу.
block.rapid-turret-rapid-drill-3.name = Бур Rapid III
block.rapid-turret-rapid-drill-3.description = Бур с питанием, добывает руду до твёрдости 4, включая торий. Вода ускоряет работу.
block.rapid-turret-rapid-drill-4.name = Бур Rapid IV
block.rapid-turret-rapid-drill-4.description = Тяжёлый бур с питанием, добывает руду до твёрдости 5. Вода ускоряет работу.
block.rapid-turret-rapid-drill-5.name = Бур Rapid V
block.rapid-turret-rapid-drill-5.description = Лучший бур с питанием, добывает руду до твёрдости 6. Вода ускоряет работу.
block.rapid-turret-rapid-forge.name = Кузница Rapid
block.rapid-turret-rapid-forge.description = Строит мехов Rapid. Каждый следующий тир требует более дорогих материалов.
unit.rapid-turret-pellet.name = Дробь
unit.rapid-turret-pellet.description = Мех 1 тира. Лёгкий разведчик с двумя скорострельными пушками.
unit.rapid-turret-burst.name = Очередь
unit.rapid-turret-burst.description = Мех 2 тира. Стреляет быстрыми очередями из двуствольных пушек.
unit.rapid-turret-volley.name = Залп
unit.rapid-turret-volley.description = Мех 3 тира. Бронированный боец передовой, стреляет трассирующими пулями.
unit.rapid-turret-barrage.name = Шквал
unit.rapid-turret-barrage.description = Мех 4 тира. Тяжёлый штурмовой шагоход с трёхствольными пушками.
unit.rapid-turret-storm.name = Шторм
unit.rapid-turret-storm.description = Мех 5 тира. Колоссальный шагоход, чьи четырёхствольные пушки пробивают броню.
block.rapid-turret-rapid-conveyor-1.name = Конвейер Rapid I
block.rapid-turret-rapid-conveyor-1.description = Конвейер 1 тира. Перемещает 7 предметов в секунду.
block.rapid-turret-rapid-conveyor-2.name = Конвейер Rapid II
block.rapid-turret-rapid-conveyor-2.description = Конвейер 2 тира. Перемещает 12 предметов в секунду.
block.rapid-turret-rapid-conveyor-3.name = Конвейер Rapid III
block.rapid-turret-rapid-conveyor-3.description = Конвейер 3 тира. Перемещает 16 предметов в секунду.
block.rapid-turret-rapid-conveyor-4.name = Конвейер Rapid IV
block.rapid-turret-rapid-conveyor-4.description = Конвейер 4 тира. Перемещает 21 предметов в секунду.
block.rapid-turret-rapid-conveyor-5.name = Конвейер Rapid V
block.rapid-turret-rapid-conveyor-5.description = Конвейер 5 тира. Перемещает 26 предметов в секунду.
unit.rapid-turret-dart.name = Дротик
unit.rapid-turret-dart.description = Воздушный корабль 1 тира. Быстрый лёгкий истребитель, кружит вокруг цели.
unit.rapid-turret-swift.name = Стриж
unit.rapid-turret-swift.description = Воздушный корабль 2 тира. Быстрый штурмовик с более тяжёлыми пушками.
unit.rapid-turret-falcon.name = Сокол
unit.rapid-turret-falcon.description = Воздушный корабль 3 тира. Бронированный истребитель, стреляет трассирующими пулями на малой высоте.
unit.rapid-turret-tempest.name = Буря
unit.rapid-turret-tempest.description = Воздушный корабль 4 тира. Тяжёлый ганшип с двумя поворотными турелями.
unit.rapid-turret-hurricane.name = Ураган
unit.rapid-turret-hurricane.description = Воздушный корабль 5 тира. Колоссальный ганшип с четырьмя поворотными турелями, чьи пули пробивают броню.
block.rapid-turret-rapid-hangar.name = Ангар Rapid
block.rapid-turret-rapid-hangar.description = Строит воздушные корабли Rapid. Каждый следующий тир требует более дорогих материалов.
