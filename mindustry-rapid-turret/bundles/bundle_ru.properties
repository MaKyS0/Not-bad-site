block.rapid-turret-rapid-1.name = Rapid I
block.rapid-turret-rapid-1.description = Скорострельная турель 1 тира. Два ствола, огромный темп огня.
block.rapid-turret-rapid-2.name = Rapid II
block.rapid-turret-rapid-2.description = Скорострельная турель 2 тира. Три ствола, выше урон и дальность.
block.rapid-turret-rapid-3.name = Rapid III
block.rapid-turret-rapid-3.description = Скорострельная турель 3 тира. Тяжёлые стволы и трассирующие пули.
block.rapid-turret-rapid-4.name = Rapid IV
block.rapid-turret-rapid-4.description = Скорострельная турель 4 тира. Четыре ствола, принимает торий.
block.rapid-turret-rapid-5.name = Rapid V
block.rapid-turret-rapid-5.description = Скорострельная турель 5 тира. Пять стволов, выстрел каждый тик.
block.rapid-turret-rapid-6.name = Rapid VI
block.rapid-turret-rapid-6.description = Вершина линейки. Шесть стволов, тяжёлые пули каждый тик, пули из кинетического сплава бьют молниями.
block.rapid-turret-rapid-wall-1.name = Стена Rapid I
block.rapid-turret-rapid-wall-1.description = Базовая усиленная стена. Дешёвая и прочная.
block.rapid-turret-rapid-wall-1-large.name = Большая стена Rapid I
block.rapid-turret-rapid-wall-1-large.description = Базовая усиленная стена. Дешёвая и прочная. Занимает 2x2 клетки.
block.rapid-turret-rapid-wall-2.name = Стена Rapid II
block.rapid-turret-rapid-wall-2.description = Стена с титановой обшивкой и большим запасом прочности.
block.rapid-turret-rapid-wall-2-large.name = Большая стена Rapid II
block.rapid-turret-rapid-wall-2-large.description = Стена с титановой обшивкой и большим запасом прочности. Занимает 2x2 клетки.
block.rapid-turret-rapid-wall-3.name = Стена Rapid III
block.rapid-turret-rapid-wall-3.description = Стена с ториевой бронёй, не боится слабых пуль.
block.rapid-turret-rapid-wall-3-large.name = Большая стена Rapid III
block.rapid-turret-rapid-wall-3-large.description = Стена с ториевой бронёй, не боится слабых пуль. Занимает 2x2 клетки.
block.rapid-turret-rapid-wall-4.name = Стена Rapid IV
block.rapid-turret-rapid-wall-4.description = Поглощает лазеры и не пропускает связи узлов питания.
block.rapid-turret-rapid-wall-4-large.name = Большая стена Rapid IV
block.rapid-turret-rapid-wall-4-large.description = Поглощает лазеры и не пропускает связи узлов питания. Занимает 2x2 клетки.
block.rapid-turret-rapid-wall-5.name = Стена Rapid V
block.rapid-turret-rapid-wall-5.description = Отражает пули и бьёт атакующих молниями.
block.rapid-turret-rapid-wall-5-large.name = Большая стена Rapid V
block.rapid-turret-rapid-wall-5-large.description = Отражает пули и бьёт атакующих молниями. Занимает 2x2 клетки.
block.rapid-turret-rapid-drill-1.name = Бур Rapid I
block.rapid-turret-rapid-drill-1.description = Добывает руду до твёрдости 2 (медь, свинец, песок, уголь). Вода ускоряет работу.
block.rapid-turret-rapid-drill-2.name = Бур Rapid II
block.rapid-turret-rapid-drill-2.description = Добывает руду до твёрдости 3, включая титан. Вода ускоряет работу.
block.rapid-turret-rapid-drill-3.name = Бур Rapid III
block.rapid-turret-rapid-drill-3.description = Бур с питанием, добывает руду до твёрдости 4, включая торий. Вода ускоряет работу.
block.rapid-turret-rapid-drill-4.name = Бур Rapid IV
block.rapid-turret-rapid-drill-4.description = Тяжёлый бур с питанием, добывает руду до твёрдости 5. Вода ускоряет работу.
block.rapid-turret-rapid-drill-5.name = Бур Rapid V
block.rapid-turret-rapid-drill-5.description = Лучший бур с питанием, добывает руду до твёрдости 6. Вода ускоряет работу.
block.rapid-turret-rapid-forge.name = Кузница Rapid
block.rapid-turret-rapid-forge.description = Строит мехов Rapid. Каждый следующий тир требует более дорогих материалов.
unit.rapid-turret-pellet.name = Дробь
unit.rapid-turret-pellet.description = Мех 1 тира. Лёгкий разведчик с двумя скорострельными пушками.
unit.rapid-turret-burst.name = Очередь
unit.rapid-turret-burst.description = Мех 2 тира. Стреляет быстрыми очередями из двуствольных пушек.
unit.rapid-turret-volley.name = Залп
unit.rapid-turret-volley.description = Мех 3 тира. Бронированный боец передовой, стреляет трассирующими пулями.
unit.rapid-turret-barrage.name = Шквал
unit.rapid-turret-barrage.description = Мех 4 тира. Тяжёлый штурмовой шагоход с трёхствольными пушками.
unit.rapid-turret-storm.name = Шторм
unit.rapid-turret-storm.description = Мех 5 тира. Колоссальный шагоход, чьи четырёхствольные пушки пробивают броню.
block.rapid-turret-rapid-conveyor-1.name = Конвейер Rapid I
block.rapid-turret-rapid-conveyor-1.description = Конвейер 1 тира. Перемещает 7 предметов в секунду.
block.rapid-turret-rapid-conveyor-2.name = Конвейер Rapid II
block.rapid-turret-rapid-conveyor-2.description = Конвейер 2 тира. Перемещает 12 предметов в секунду.
block.rapid-turret-rapid-conveyor-3.name = Конвейер Rapid III
block.rapid-turret-rapid-conveyor-3.description = Конвейер 3 тира. Перемещает 16 предметов в секунду.
block.rapid-turret-rapid-conveyor-4.name = Конвейер Rapid IV
block.rapid-turret-rapid-conveyor-4.description = Конвейер 4 тира. Перемещает 21 предметов в секунду.
block.rapid-turret-rapid-conveyor-5.name = Конвейер Rapid V
block.rapid-turret-rapid-conveyor-5.description = Конвейер 5 тира. Перемещает 26 предметов в секунду.
unit.rapid-turret-dart.name = Дротик
unit.rapid-turret-dart.description = Воздушный корабль 1 тира. Быстрый лёгкий истребитель, кружит вокруг цели.
unit.rapid-turret-swift.name = Стриж
unit.rapid-turret-swift.description = Воздушный корабль 2 тира. Быстрый штурмовик с более тяжёлыми пушками.
unit.rapid-turret-falcon.name = Сокол
unit.rapid-turret-falcon.description = Воздушный корабль 3 тира. Бронированный истребитель, стреляет трассирующими пулями на малой высоте.
unit.rapid-turret-tempest.name = Буря
unit.rapid-turret-tempest.description = Воздушный корабль 4 тира. Тяжёлый ганшип с двумя поворотными турелями.
unit.rapid-turret-hurricane.name = Ураган
unit.rapid-turret-hurricane.description = Воздушный корабль 5 тира. Колоссальный ганшип с четырьмя поворотными турелями, чьи пули пробивают броню.
block.rapid-turret-rapid-hangar.name = Ангар Rapid
block.rapid-turret-rapid-hangar.description = Строит воздушные корабли Rapid. Каждый следующий тир требует более дорогих материалов.
block.rapid-turret-rapid-pulse-1.name = Импульс I
block.rapid-turret-rapid-pulse-1.description = Маленькая лазерная турель. Вместо патронов нужна энергия, 12 выстрелов в секунду.
block.rapid-turret-rapid-pulse-2.name = Импульс II
block.rapid-turret-rapid-pulse-2.description = Два излучателя, 20 лазерных импульсов в секунду, патроны не нужны.
block.rapid-turret-rapid-pulse-3.name = Импульс III
block.rapid-turret-rapid-pulse-3.description = Три излучателя; импульсы пробивают две цели насквозь.
block.rapid-turret-rapid-pulse-4.name = Импульс IV
block.rapid-turret-rapid-pulse-4.description = Четыре излучателя, выстрел каждый тик, пробивает три цели. Потребляет очень много энергии.
block.rapid-turret-rapid-buckshot-1.name = Картечь I
block.rapid-turret-rapid-buckshot-1.description = Маленький скорострельный дробовик. Малая дальность, три дробины за выстрел. Принимает металлолом.
block.rapid-turret-rapid-buckshot-2.name = Картечь II
block.rapid-turret-rapid-buckshot-2.description = Четыре дробины за выстрел, сокрушителен вблизи.
block.rapid-turret-rapid-buckshot-3.name = Картечь III
block.rapid-turret-rapid-buckshot-3.description = Пять дробин за выстрел; ториевая картечь пробивает и отбрасывает врагов.
block.rapid-turret-rapid-buckshot-4.name = Картечь IV
block.rapid-turret-rapid-buckshot-4.description = Пять тяжёлых дробин двенадцать раз в секунду. Рвёт в клочья всё, что подошло близко.
block.rapid-turret-rapid-shield-wall-1.name = Щитовая стена I
block.rapid-turret-rapid-shield-wall-1.description = Стена с небольшим энергощитом. Требует энергию и передаёт её соседним щитовым стенам.
block.rapid-turret-rapid-shield-wall-1-large.name = Большая щитовая стена I
block.rapid-turret-rapid-shield-wall-1-large.description = Стена с небольшим энергощитом. Требует энергию и передаёт её соседним щитовым стенам. Занимает 2x2 клетки.
block.rapid-turret-rapid-shield-wall-2.name = Щитовая стена II
block.rapid-turret-rapid-shield-wall-2.description = Титановая щитовая стена: щит прочнее и восстанавливается быстрее.
block.rapid-turret-rapid-shield-wall-2-large.name = Большая щитовая стена II
block.rapid-turret-rapid-shield-wall-2-large.description = Титановая щитовая стена: щит прочнее и восстанавливается быстрее. Занимает 2x2 клетки.
block.rapid-turret-rapid-shield-wall-3.name = Щитовая стена III
block.rapid-turret-rapid-shield-wall-3.description = Бронированная ториевая щитовая стена.
block.rapid-turret-rapid-shield-wall-3-large.name = Большая щитовая стена III
block.rapid-turret-rapid-shield-wall-3-large.description = Бронированная ториевая щитовая стена. Занимает 2x2 клетки.
block.rapid-turret-rapid-shield-wall-4.name = Щитовая стена IV
block.rapid-turret-rapid-shield-wall-4.description = Самый мощный щит; стена под ним ещё и отражает пули.
block.rapid-turret-rapid-shield-wall-4-large.name = Большая щитовая стена IV
block.rapid-turret-rapid-shield-wall-4-large.description = Самый мощный щит; стена под ним ещё и отражает пули. Занимает 2x2 клетки.
unit.rapid-turret-skiff.name = Ялик
unit.rapid-turret-skiff.description = Боевой корабль 1 тира. Небольшая патрульная лодка с одной скорострельной турелью.
unit.rapid-turret-cutter.name = Катер
unit.rapid-turret-cutter.description = Боевой корабль 2 тира. Спаренная турель на носу и зенитка на корме, сбивающая авиацию.
unit.rapid-turret-corvette.name = Корвет
unit.rapid-turret-corvette.description = Боевой корабль 3 тира. Две спаренные турели и пара зениток под толстой бронёй.
unit.rapid-turret-frigate.name = Фрегат
unit.rapid-turret-frigate.description = Боевой корабль 4 тира. Плавучая крепость с двумя трёхствольными турелями и четырьмя зенитками.
unit.rapid-turret-dreadnought.name = Дредноут
unit.rapid-turret-dreadnought.description = Боевой корабль 5 тира. Три четырёхствольные турели бьют пробивающими снарядами, а четыре тяжёлые зенитки очищают небо.
block.rapid-turret-rapid-shipyard.name = Верфь Rapid
block.rapid-turret-rapid-shipyard.description = Строит боевые корабли Rapid. Может стоять на глубокой воде у берега; выход должен смотреть на воду.
unit.rapid-turret-mite.name = Клещ
unit.rapid-turret-mite.description = Шагоход 1 тира. Крошечный паук с двумя мортирами. Ходит по постройкам; не может атаковать авиацию.
unit.rapid-turret-weaver.name = Ткач
unit.rapid-turret-weaver.description = Шагоход 2 тира. Забрасывает разрывные снаряды через стены с безопасной дистанции.
unit.rapid-turret-stalker.name = Ловец
unit.rapid-turret-stalker.description = Шагоход 3 тира. Шесть ног, тяжёлые мортиры и пара зениток против авиации.
unit.rapid-turret-tarantula.name = Тарантул
unit.rapid-turret-tarantula.description = Шагоход 4 тира. Осадный паук, который бьёт дальше большинства турелей; его шаги давят всё под ногами.
unit.rapid-turret-goliath.name = Голиаф
unit.rapid-turret-goliath.description = Шагоход 5 тира. Колоссальная осадная машина: огромный радиус взрыва и самая большая дальность среди юнитов Rapid.
block.rapid-turret-rapid-nest.name = Гнездо Rapid
block.rapid-turret-rapid-nest.description = Строит шагоходов Rapid — осадных пауков, перешагивающих через стены.
block.rapid-turret-rapid-mortar-1.name = Мортира I
block.rapid-turret-rapid-mortar-1.description = Маленькая скорострельная артиллерия. Большая дальность, урон по площади, только наземные цели.
block.rapid-turret-rapid-mortar-2.name = Мортира II
block.rapid-turret-rapid-mortar-2.description = Два ствола; принимает взрывчатую смесь для более мощных взрывов. Не достаёт цели вплотную.
block.rapid-turret-rapid-mortar-3.name = Мортира III
block.rapid-turret-rapid-mortar-3.description = Три ствола, три снаряда в секунду. Пластаниевые снаряды отбрасывают врагов.
block.rapid-turret-rapid-mortar-4.name = Мортира IV
block.rapid-turret-rapid-mortar-4.description = Четыре ствола и самая большая дальность в арсенале. Сравнивает с землёй наземные атаки ещё на подходе.
block.rapid-turret-rapid-generator-1.name = Динамо I
block.rapid-turret-rapid-generator-1.description = Компактная топка. Превращает уголь, споры или пиротит в 240 единиц энергии в секунду.
block.rapid-turret-rapid-generator-2.name = Динамо II
block.rapid-turret-rapid-generator-2.description = Топка с водяным охлаждением: 780 единиц энергии в секунду — хватит на Импульс III.
block.rapid-turret-rapid-generator-3.name = Динамо III
block.rapid-turret-rapid-generator-3.description = Ториевый элемент. 1560 единиц энергии в секунду без охлаждения и без взрывов.
block.rapid-turret-rapid-generator-4.name = Динамо IV
block.rapid-turret-rapid-generator-4.description = Фазовое ядро с криогенным охлаждением. 3900 единиц энергии в секунду.
block.rapid-turret-rapid-solar.name = Солнечная батарея Rapid
block.rapid-turret-rapid-solar.description = Плотная солнечная батарея. 180 единиц энергии в секунду вообще без топлива.
block.rapid-turret-rapid-battery.name = Накопитель Rapid
block.rapid-turret-rapid-battery.description = Хранит 80000 единиц энергии — хватит почти на минуту стрельбы Импульса IV.
